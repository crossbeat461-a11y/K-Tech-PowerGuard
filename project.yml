name: K-Tech PowerGuard
options:
  bundleIdPrefix: com.ktech
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  K-Tech PowerGuard:
    type: application
    platform: macOS
    sources:
      - path: K-Tech PowerGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ktech.powerguard
        PRODUCT_NAME: K-Tech PowerGuard
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: K-Tech PowerGuard
        INFOPLIST_KEY_NSUserNotificationUsageDescription: "バッテリー残量の通知を表示します。"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: K-Tech PowerGuard/K-Tech PowerGuard.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: K-Tech PowerGuard/K-Tech PowerGuard.entitlements
