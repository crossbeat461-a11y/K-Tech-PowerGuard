# GitHub Actions（手動セットアップ用）

`gh auth refresh -h github.com -s workflow` のあと、
このファイルを `.github/workflows/release.yml` にコピーして push すると
タグ `v*` または手動実行で DMG をビルドできます。

```yaml
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and DMG
        run: |
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
